  <script>
    // Apply the saved theme before the first paint so the page never flashes.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    // The main site (shadcn/ui) is dark unless the visitor picked light.
    if (location.pathname.replace(/\/+$/, '') === '') {
      var p = 'dark'; try { p = localStorage.getItem('pro-theme') || 'dark'; } catch (e) {}
      if (p === 'dark') document.documentElement.classList.add('dark');
      document.documentElement.style.background = p === 'dark' ? '#09090b' : '#ffffff';
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
